[project]
name = "mandi-forecast"
version = "0.1.0"
description = "Daily mandi price forecasts and conformal price-spike alerts for tomato, onion and potato"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=15",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "requests>=2.31",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "lxml>=5.0",
]

[project.optional-dependencies]
chronos = ["chronos-forecasting>=1.4", "torch>=2.2"]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
mandi = "mandi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
